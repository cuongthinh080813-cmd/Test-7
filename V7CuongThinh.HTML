<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🔥 MENU HACK FF - ACC BOT 🔥</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu {
            max-width: 550px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 30px;
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 0 60px rgba(255,0,0,0.2);
        }
        h1 {
            text-align: center;
            font-size: 26px;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .sub { text-align: center; color: #ff4444; font-size: 14px; margin-bottom: 20px; }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
        }
        .section h3 { color: #ffd700; font-size: 15px; margin-bottom: 10px; }
        .color-circle {
            display: inline-block;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            margin: 4px;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.2);
            transition: 0.3s;
        }
        .color-circle:hover { transform: scale(1.2); border-color: #fff; }
        .color-circle.active { transform: scale(1.2); border-color: #ffd700; box-shadow: 0 0 20px currentColor; }
        .slider-section { margin: 8px 0; }
        .slider-section label { color: #ccc; font-size: 13px; display: flex; justify-content: space-between; }
        .slider-section label span { color: #00ff00; font-weight: bold; }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00);
            border-radius: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            border: 2px solid #fff;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            margin: 4px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .toggle-row span { color: #ccc; font-size: 13px; }
        .toggle {
            width: 48px;
            height: 24px;
            background: #333;
            border-radius: 30px;
            cursor: pointer;
            border: none;
            position: relative;
            transition: 0.3s;
        }
        .toggle.active { background: linear-gradient(90deg, #ff0000, #ff8800); }
        .toggle::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle.active::after { left: 27px; }
        .btn-apply {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8a2be2);
            background-size: 300% 100%;
            animation: rainbow 3s linear infinite;
            cursor: pointer;
        }
        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .status {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0,255,0,0.05);
            border: 1px solid rgba(0,255,0,0.1);
            color: #0f0;
            font-weight: bold;
            font-size: 14px;
            min-height: 45px;
        }
        .warning {
            text-align: center;
            margin-top: 12px;
            color: #ff4444;
            font-size: 12px;
            border-top: 1px solid rgba(255,0,0,0.2);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="menu" id="menu">
    <h1>🔥 MENU HACK FF 🔥</h1>
    <div class="sub">⚡ Dành cho ACC BOT - Tác dụng 100% ⚡</div>

    <!-- Vòng tròn 7 màu -->
    <div class="section">
        <h3>🌈 VÒNG TRÒN 7 MÀU - ĐỊNH VỊ KẺ ĐỊCH</h3>
        <div style="text-align:center;">
            <span class="color-circle active" style="background:#ff0000;" onclick="selectColor(this,'#ff0000')"></span>
            <span class="color-circle" style="background:#ff8c00;" onclick="selectColor(this,'#ff8c00')"></span>
            <span class="color-circle" style="background:#ffd700;" onclick="selectColor(this,'#ffd700')"></span>
            <span class="color-circle" style="background:#00ff00;" onclick="selectColor(this,'#00ff00')"></span>
            <span class="color-circle" style="background:#1e90ff;" onclick="selectColor(this,'#1e90ff')"></span>
            <span class="color-circle" style="background:#8a2be2;" onclick="selectColor(this,'#8a2be2')"></span>
            <span class="color-circle" style="background:#ff00ff;" onclick="selectColor(this,'#ff00ff')"></span>
        </div>
        <p style="text-align:center;color:#888;font-size:12px;margin-top:8px;">✅ Mỗi màu = 1 kẻ địch hiển thị</p>
    </div>

    <!-- Chức năng hack -->
    <div class="section">
        <h3>🎯 CHỨC NĂNG HACK</h3>
        
        <div class="slider-section">
            <label>AIM ĐẦU 100% <span id="valHead">100</span>%</label>
            <input type="range" min="0" max="100" value="100" oninput="document.getElementById('valHead').innerHTML=this.value">
        </div>
        
        <div class="slider-section">
            <label>AIM BODY 100% <span id="valBody">100</span>%</label>
            <input type="range" min="0" max="100" value="100" oninput="document.getElementById('valBody').innerHTML=this.value">
        </div>
        
        <div class="slider-section">
            <label>NHÌN XUYÊN TƯỜNG <span id="valWall">100</span>%</label>
            <input type="range" min="0" max="100" value="100" oninput="document.getElementById('valWall').innerHTML=this.value">
        </div>
    </div>

    <!-- Bật/tắt -->
    <div class="section">
        <h3>⚙️ CHẾ ĐỘ</h3>
        
        <div class="toggle-row">
            <span>🔄 XOAY 360° TỰ ĐỘNG</span>
            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
        </div>
        
        <div class="toggle-row">
            <span>🎯 BẮN TỰ ĐỘNG</span>
            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
        </div>
        
        <div class="toggle-row">
            <span>👁️ HIỆN VỊ TRÍ ĐỊCH</span>
            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
        </div>
        
        <div class="toggle-row">
            <span>💀 KHÔNG NHẬN SÁT THƯƠNG</span>
            <button class="toggle active" onclick="this.classList.toggle('active')"></button>
        </div>
    </div>

    <!-- Nút áp dụng -->
    <button class="btn-apply" onclick="applyAll()">▶️ ÁP DỤNG - TÁC DỤNG 100%</button>

    <div class="status" id="status">✅ SẴN SÀNG - CHỜ KÍCH HOẠT</div>
    
    <div class="warning">⚠️ CHỈ DÙNG CHO ACC BOT - RỦI RO BAN ACC</div>
</div>

<script>
    let selectedColor = '#ff0000';
    
    function selectColor(el, color) {
        document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selectedColor = color;
        document.getElementById('status').innerHTML = '🌈 Đã chọn màu: ' + color + ' - Định vị kẻ địch!';
        document.getElementById('status').style.color = '#ffd700';
    }
    
    function applyAll() {
        const status = document.getElementById('status');
        status.innerHTML = '✅🔥 ĐÃ ÁP DỤNG - TÁC DỤNG 100% - HACK ACTIVE 🔥✅';
        status.style.color = '#00ff00';
        status.style.borderColor = '#00ff00';
        status.style.background = 'rgba(0,255,0,0.15)';
        
        // Rung menu
        document.getElementById('menu').style.animation = 'shake 0.5s ease-in-out';
        setTimeout(() => {
            document.getElementById('menu').style.animation = '';
        }, 600);
        
        // Hiệu ứng flash
        document.body.style.transition = '0.3s';
        document.body.style.background = '#111';
        setTimeout(() => {
            document.body.style.background = '#0a0a0a';
        }, 300);
    }
    
    // Thêm keyframe shake
    const style = document.createElement('style');
    style.textContent = `
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
