<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>🎂 MENU SINH NHẬT - 7 MÀU</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* Nền bong bóng sinh nhật */
        body::before {
            content: '🎂 🎈 🎉 🎁 🎊 🥳 🎂 🎈 🎉 🎁 🎊 🥳';
            position: fixed;
            font-size: 40px;
            word-spacing: 20px;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }
        
        .menu {
            position: relative;
            z-index: 1;
            max-width: 520px;
            width: 100%;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 30px;
            padding: 30px 25px;
            border: 2px solid rgba(255,215,0,0.3);
            box-shadow: 0 0 60px rgba(255,215,0,0.15), inset 0 0 60px rgba(255,215,0,0.05);
            animation: borderGlow 3s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0%,100% { border-color: rgba(255,0,0,0.4); }
            16% { border-color: rgba(255,165,0,0.4); }
            33% { border-color: rgba(255,215,0,0.4); }
            50% { border-color: rgba(0,255,0,0.4); }
            66% { border-color: rgba(0,150,255,0.4); }
            83% { border-color: rgba(75,0,130,0.4); }
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8a2be2, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            animation: rainbowText 4s linear infinite;
        }
        @keyframes rainbowText {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        .header p {
            color: #ffd700;
            font-size: 14px;
            animation: sparkle 1.5s ease-in-out infinite;
        }
        @keyframes sparkle {
            0%,100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        /* Vòng tròn 7 màu */
        .color-section {
            text-align: center;
            margin: 15px 0;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .color-section h3 {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }
        .color-circle {
            display: inline-block;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin: 4px;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .color-circle:hover {
            transform: scale(1.3) rotate(10deg);
            border-color: #fff;
            box-shadow: 0 0 30px currentColor;
        }
        .color-circle.active {
            transform: scale(1.2);
            border-color: #fff;
            box-shadow: 0 0 40px currentColor;
            animation: pulse 1s ease-in-out infinite;
        }
        .color-circle.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        @keyframes pulse {
            0%,100% { transform: scale(1.2); }
            50% { transform: scale(1.3); }
        }
        
        /* Slider */
        .slider-section {
            margin: 10px 0;
            padding: 10px 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
        }
        .slider-section label {
            color: #ccc;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }
        .slider-section label span {
            color: #ffd700;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8a2be2);
            border-radius: 10px;
            margin: 8px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, #aaa);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
            border: 2px solid #ffd700;
        }
        
        /* Toggle switch */
        .toggle-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            margin: 5px 0;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
        }
        .toggle-section span {
            color: #ccc;
            font-size: 13px;
        }
        .toggle {
            width: 50px;
            height: 26px;
            background: #333;
            border-radius: 30px;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
            border: none;
        }
        .toggle.active {
            background: linear-gradient(90deg, #ff0000, #ff8800);
        }
        .toggle::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .toggle.active::after {
            left: 27px;
        }
        
        /* Nút áp dụng */
        .btn-apply {
            width: 100%;
            padding: 16px;
            margin-top: 18px;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 900;
            color: white;
            background: linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #8a2be2);
            background-size: 300% 100%;
            animation: rainbowBtn 3s linear infinite;
            cursor: pointer;
            transition: 0.3s;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        @keyframes rainbowBtn {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .btn-apply:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(255,215,0,0.3);
        }
        .btn-apply:active {
            transform: scale(0.95);
        }
        
        /* Status */
        .status {
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            background: rgba(255,255,255,0.03);
            color: #0f0;
            border: 1px solid rgba(0,255,0,0.1);
            transition: 0.5s;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .status.happy {
            background: rgba(255,215,0,0.1);
            border-color: #ffd700;
            color: #ffd700;
            font-size: 18px;
        }
        
        /* Birthday badge */
        .badge {
            text-align: center;
            margin-top: 12px;
            font-size: 20px;
            letter-spacing: 8px;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        /* Confetti effect khi apply */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            font-size: 30px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="menu" id="menu">
    <!-- Header -->
    <div class="header">
        <h1>🎂 HAPPY BIRTHDAY! 🎂</h1>
        <p>✨ Menu đặc biệt dành riêng cho bạn ✨</p>
    </div>

    <!-- 7 Màu vòng tròn -->
    <div class="color-section">
        <h3>🌈 VÒNG TRÒN 7 MÀU - CHỌN MÀU CỦA BẠN</h3>
        <div>
            <span class="color-circle active" style="background:#ff0000; color:#ff0000;" onclick="selectColor(this, '#ff0000')"></span>
            <span class="color-circle" style="background:#ff8c00; color:#ff8c00;" onclick="selectColor(this, '#ff8c00')"></span>
            <span class="color-circle" style="background:#ffd700; color:#ffd700;" onclick="selectColor(this, '#ffd700')"></span>
            <span class="color-circle" style="background:#00ff00; color:#00ff00;" onclick="selectColor(this, '#00ff00')"></span>
            <span class="color-circle" style="background:#1e90ff; color:#1e90ff;" onclick="selectColor(this, '#1e90ff')"></span>
            <span class="color-circle" style="background:#4b0082; color:#4b0082;" onclick="selectColor(this, '#4b0082')"></span>
            <span class="color-circle" style="background:#ff00ff; color:#ff00ff;" onclick="selectColor(this, '#ff00ff')"></span>
        </div>
    </div>

    <!-- Độ nhạy -->
    <div class="slider-section">
        <label>AIM ĐẦU 100% <span id="valHead">100</span>%</label>
        <input type="range" min="50" max="100" value="100" oninput="updateVal('valHead', this.value)">
    </div>
    <div class="slider-section">
        <label>AIM BODY 100% <span id="valBody">100</span>%</label>
        <input type="range" min="50" max="100" value="100" oninput="updateVal('valBody', this.value)">
    </div>
    <div class="slider-section">
        <label>ĐỊNH VỊ XUYÊN TƯỜNG <span id="valWall">100</span>%</label>
        <input type="range" min="50" max="100" value="100" oninput="updateVal('valWall', this.value)">
    </div>

    <!-- Toggle -->
    <div class="toggle-section">
        <span>🔄 XOAY 360°</span>
        <button class="toggle active" onclick="toggleBtn(this)"></button>
    </div>
    <div class="toggle-section">
        <span>🎯 CHẾ ĐỘ BẬT/TẮT</span>
        <button class="toggle active" onclick="toggleBtn(this)"></button>
    </div>
    <div class="toggle-section">
        <span>👁️ NHÌN XUYÊN TƯỜNG</span>
        <button class="toggle active" onclick="toggleBtn(this)"></button>
    </div>

    <!-- Nút áp dụng -->
    <button class="btn-apply" onclick="applyAll()">🎁 ÁP DỤNG - TÁC DỤNG 100%</button>

    <!-- Status -->
    <div class="status" id="status">✅ SẴN SÀNG - CHỜ BẠN BẤM ÁP DỤNG</div>

    <!-- Badge -->
    <div class="badge">🎈 🎉 🎊 🥳</div>
</div>

<script>
    let selectedColor = '#ff0000';
    
    function selectColor(el, color) {
        document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        selectedColor = color;
        document.getElementById('menu').style.borderColor = color;
        document.getElementById('status').innerHTML = '🌈 Đã chọn màu: ' + color + ' - Đẹp quá!';
        document.getElementById('status').className = 'status happy';
    }
    
    function updateVal(id, val) {
        document.getElementById(id).innerHTML = val;
    }
    
    function toggleBtn(el) {
        el.classList.toggle('active');
    }
    
    function applyAll() {
        const status = document.getElementById('status');
        status.className = 'status happy';
        status.innerHTML = '🎂 CHÚC MỪNG SINH NHẬT! TÁC DỤNG 100% - AIM ĐỈNH - NHẸ TÂM! 🎂';
        
        // Confetti
        const emojis = ['🎂','🎈','🎉','🎊','🥳','🎁','✨','🌟','💫','❤️','🌈','🔥'];
        const container = document.createElement('div');
        container.className = 'confetti-container';
        document.body.appendChild(container);
        
        for(let i = 0; i < 50; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 30 + 20) + 'px';
                el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                el.style.animationDelay = (Math.random() * 0.5) + 's';
                container.appendChild(el);
                
                setTimeout(() => el.remove(), 5000);
            }, i * 60);
        }
        
        setTimeout(() => container.remove(), 6000);
        
        // Rung menu
        const menu = document.getElementById('menu');
        menu.style.animation = 'none';
        setTimeout(() => {
            menu.style.animation = 'borderGlow 0.5s ease-in-out 6';
        }, 10);
    }
    
    // Happy birthday message on load
    window.onload = function() {
        const status = document.getElementById('status');
        status.className = 'status happy';
        status.innerHTML = '🎂 HAPPY BIRTHDAY! HÔM NAY LÀ NGÀY CỦA BẠN! 🎂';
    }
</script>

</body>
</html>key: Cuong Thinh
